---
- name: Render IOS-XE access-switch golden configuration
  hosts: localhost
  gather_facts: false

  vars:
    golden_config_template_path: "{{ playbook_dir }}/../../templates/iosxe_access_switch_golden_config.j2"
    golden_config_render_output_dir: "{{ playbook_dir }}/../artifacts/rendered-configs"
    golden_config_render_context_output_dir: "{{ playbook_dir }}/../artifacts/render-contexts"
    golden_config_write_render_context: true

  roles:
    - role: netbox_golden_config_render
