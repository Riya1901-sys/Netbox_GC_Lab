- name: Query interfaces
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/dcim/interfaces/?device_id={{ device.id }}&limit=200"
    method: GET
    headers: "{{ golden_config_netbox_headers }}"
    return_content: true
  register: interfaces_query
  no_log: true

- name: Query VLANs
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/ipam/vlans/?site_id={{ device.site.id }}&limit=200"
    method: GET
    headers: "{{ golden_config_netbox_headers }}"
    return_content: true
  register: vlans_query
  no_log: true

- name: Query primary IP
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/ipam/ip-addresses/{{ device.primary_ip4.id }}/"
    method: GET
    headers: "{{ golden_config_netbox_headers }}"
    return_content: true
  register: primary_ip4_query
  when: device.primary_ip4 is defined
  no_log: true

- name: Query device IPs
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/ipam/ip-addresses/?device_id={{ device.id }}&family=4&limit=100"
    method: GET
    headers: "{{ golden_config_netbox_headers }}"
    return_content: true
  register: device_ips_query
  no_log: true

- name: Query management prefix
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/ipam/prefixes/?site_id={{ device.site.id }}&tag=management-subnet&limit=50"
    method: GET
    headers: "{{ golden_config_netbox_headers }}"
    return_content: true
  register:  mgmt_prefix_query
  no_log: true

- name: Query OOB prefix
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/ipam/prefixes/?site_id={{ device.site.id }}&tag=oob-subnet&limit=50"
    method: GET
    headers: "{{ golden_config_netbox_headers }}"
    return_content: true
  register: oob_prefix_query
  no_log: true

- name: Normalize NetBox data
  set_fact:
    golden_config_interfaces_all: "{{ interfaces_query.json.results | default([]) }}"
    golden_config_vlans_all: "{{ vlans_query.json.results | default([]) }}"
    golden_config_device_ip_records: "{{ device_ips_query.json.results | default([]) }}"
    golden_config_management_prefix_record: >-
      {{
        (mgmt_prefix_query.json.results | first) | default({})
      }}
    golden_config_oob_prefix_record: >-
      {{
        (oob_prefix_query.json.results | first) | default({})
      }}

- name: Set golden config context from NetBox
  set_fact:
    golden_config_context: "{{ device.config_context.golden_config | default({}) }}"
    
- name: Map query variables for build_context compatibility
  set_fact:
    golden_config_management_prefix_query: "{{ mgmt_prefix_query }}"
    golden_config_oob_prefix_query: "{{ oob_prefix_query }}"   

- include_role:
    name: render/build_context
  vars:
    device: "{{ device }}"

- include_role:
    name: render/render_template
  vars:
    device: "{{ device }}"       